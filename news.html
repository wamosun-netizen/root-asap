<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>News — Root ASAP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="notifications.css">
<style>
  :root{
    --green-50:#EAF4EE; --green-100:#CBE6D6; --green-200:#A0D2B8; --green-300:#6FB894;
    --green-400:#429973; --green-500:#1F6F4A; --green-600:#175A3B; --green-700:#12472F;
    --green-800:#0F3D28; --green-900:#0A2A1B;
    --gold-50:#FBF3E3; --gold-100:#F3DFB0; --gold-200:#E9C67D; --gold-300:#DCAA52;
    --gold-400:#C8963A; --gold-500:#B8862B; --gold-600:#96701F; --gold-700:#6B4E12;
    --gray-0:#FFFFFF; --gray-50:#FAFAF8; --gray-100:#F2F1ED; --gray-200:#E4E2DB;
    --gray-300:#CFCDC3; --gray-400:#A9A69A; --gray-500:#83807A; --gray-600:#605D52;
    --gray-700:#45433B; --gray-800:#2E2C27; --gray-900:#1A1917;
    --success:#1F6F4A; --success-bg:#EAF4EE; --success-text:#12472F;
    --font-display:'Fraunces', Georgia, serif;
    --font-body:'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    --radius-sm:8px; --radius-md:14px; --radius-lg:20px; --radius-pill:999px;
    --shadow-card:0 1px 2px rgba(15,61,40,0.05), 0 4px 14px rgba(15,61,40,0.06);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--gray-100); color:var(--gray-900); font-family:var(--font-body); font-size:14px; line-height:1.6;}
  a{color:inherit; text-decoration:none;}
  .container{max-width:900px; margin:0 auto; padding:0 28px;}

  nav.mainnav{background:var(--green-900); padding:14px 0;}
  .nav-inner{max-width:1180px; margin:0 auto; padding:0 28px; display:flex; align-items:center; justify-content:space-between; gap:24px;}
  .logo{font-family:var(--font-display); font-weight:600; font-size:19px; color:#fff; display:flex; align-items:center; gap:8px; flex-shrink:0;}
  .logo svg{width:20px; height:20px;}
  .nav-links{display:flex; gap:26px; font-size:13.5px; font-weight:500; color:rgba(255,255,255,0.75);}
  .nav-links a:hover{color:#fff;}
  .nav-hamburger{display:none; background:none; border:none; padding:6px; margin:0; cursor:pointer; color:#fff; align-items:center; justify-content:center; flex-shrink:0;}
  .nav-hamburger svg{width:22px; height:22px; display:block;}
  .nav-drawer{display:none; flex-direction:column; background:var(--green-800);}
  .nav-drawer.open{display:flex;}
  .nav-drawer-links{display:flex; flex-direction:column;}
  .nav-drawer a{display:block; padding:12px 28px; color:rgba(255,255,255,0.85); font-size:14px; font-weight:600; border-bottom:1px solid rgba(255,255,255,0.08); text-decoration:none;}
  .nav-drawer a:last-child{border-bottom:none;}
  .nav-icons{display:flex; align-items:center; gap:20px; flex-shrink:0;}
  .signup-btn{background:#F4F1E9; color:var(--green-900); font-weight:600; font-size:13px; padding:9px 18px; border-radius:var(--radius-pill); white-space:nowrap;}
  .user-chip-wrap{display:none; align-items:center; gap:12px;}
  .user-chip{display:flex; align-items:center; gap:8px; color:#fff; font-size:13px; font-weight:600;}
  .user-avatar{width:28px; height:28px; border-radius:50%; background:var(--gold-400); color:#2E2107; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; flex-shrink:0;}
  .logout-link{font-size:12px; color:rgba(255,255,255,0.6); font-weight:600;}
  .logout-link:hover{color:#fff;}

  .back-link{display:inline-flex; align-items:center; gap:6px; font-size:13px; color:var(--gray-500); font-weight:600; margin:32px 0 20px;}
  .back-link:hover{color:var(--green-700);}
  .back-link svg{width:14px; height:14px;}

  .article-card{background:#fff; border:1px solid var(--gray-200); border-radius:var(--radius-lg); padding:40px 44px; box-shadow:var(--shadow-card); margin-bottom:32px;}
  .article-eyebrow{font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.6px; color:var(--green-600); margin-bottom:12px;}
  .article-card h1{font-family:var(--font-display); font-size:30px; font-weight:600; color:var(--green-900); line-height:1.2;}
  .article-byline{font-size:12.5px; color:var(--gray-500); margin-top:12px;}

  .stat-strip{display:grid; grid-template-columns:repeat(3,1fr); gap:16px; background:var(--green-50); border-radius:var(--radius-md); padding:22px 24px; margin:26px 0;}
  .stat-strip div{display:flex; flex-direction:column;}
  .stat-strip b{font-family:var(--font-display); font-size:22px; color:var(--green-800); font-weight:600;}
  .stat-strip span{font-size:11px; color:var(--gray-600); text-transform:uppercase; letter-spacing:0.4px; margin-top:4px;}

  .article-body p{font-size:14.5px; color:var(--gray-800); line-height:1.75; margin-bottom:16px;}

  .article-cta{display:flex; align-items:center; justify-content:space-between; gap:20px; background:var(--green-900); border-radius:var(--radius-lg); padding:26px 30px; margin-top:32px; flex-wrap:wrap;}
  .article-cta h4{font-family:var(--font-display); color:#fff; font-size:16.5px; font-weight:600;}
  .article-cta p{color:rgba(255,255,255,0.65); font-size:12.5px; margin-top:4px;}
  .btn-cta{background:var(--gold-500); color:#2E2107; font-weight:700; font-size:13.5px; padding:11px 22px; border-radius:999px; white-space:nowrap;}

  .related-head{font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; color:var(--gray-500); margin-bottom:14px;}
  .related-item{display:block; background:#fff; border:1px solid var(--gray-200); border-radius:var(--radius-md); padding:16px 18px; font-size:13.5px; font-weight:600; color:var(--gray-800); margin-bottom:10px;}
  .related-item:hover{color:var(--green-700); border-color:var(--green-400);}

  footer{background:var(--green-900); padding:40px 0; margin-top:40px;}
  .footer-inner{max-width:1180px; margin:0 auto; padding:0 28px; display:flex; justify-content:space-between; align-items:center; color:rgba(255,255,255,0.5); font-size:12px;}
  .flogo{font-family:var(--font-display); color:#fff; font-weight:600; font-size:15px;}

  @media (max-width:700px){
    .article-card{padding:26px 22px;}
    .stat-strip{grid-template-columns:1fr;}
    .nav-links{display:none;}
    .nav-hamburger{display:flex;}
    .nav-inner{gap:10px;}
  }
  @media (max-width:480px){
    .signup-btn{padding:8px 14px; font-size:12px;}
    #userChipName{display:none;}
  }
</style>
</head>
<body>

<nav class="mainnav">
  <div class="nav-inner">
    <a class="logo" href="index.html">
      <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="20" cy="20" r="19" stroke="#E9C67D" stroke-width="1.2"/>
        <path d="M20 11 L20 22" stroke="#E9C67D" stroke-width="2" stroke-linecap="round"/>
        <path d="M20 14 L15 9" stroke="#E9C67D" stroke-width="2" stroke-linecap="round"/>
        <path d="M20 14 L25 9" stroke="#E9C67D" stroke-width="2" stroke-linecap="round"/>
        <path d="M20 22 C 20 22, 13 24, 11 30" stroke="#B8862B" stroke-width="2" stroke-linecap="round" fill="none"/>
        <path d="M20 22 C 20 22, 20 26, 20 31" stroke="#B8862B" stroke-width="2" stroke-linecap="round" fill="none"/>
        <path d="M20 22 C 20 22, 27 24, 29 30" stroke="#B8862B" stroke-width="2" stroke-linecap="round" fill="none"/>
      </svg>
      Root ASAP
    </a>
    <div class="nav-links">
      <a href="index.html#browse">Marketplace</a>
      <a href="index.html#business">For business owners</a>
      <a href="dashboard.html">Dashboard</a>
    </div>
    <div class="nav-icons">
      <button class="nav-hamburger" id="navHamburger" aria-label="Menu" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18" stroke-linecap="round"/></svg></button>
      <div class="notif-bell-wrap" id="notifBellWrap"></div>
      <a class="signup-btn" href="auth.html" id="signupBtn">Sign up</a>
      <div class="user-chip-wrap" id="userChipWrap">
        <a class="user-chip" id="userChipLink" href="dashboard.html"><span class="user-avatar" id="userAvatarInitials">--</span><span id="userChipName">Name</span></a>
        <a class="logout-link" id="logoutLink" href="#">Log out</a>
      </div>
    </div>
  </div>
  <div class="nav-drawer" id="navDrawer"></div>
</nav>

<div class="container">
  <a class="back-link" href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg>Back to home</a>

  <div class="article-card" id="articleCard">
    <!-- populated by JS -->
  </div>

  <div class="related-head">More news</div>
  <div id="relatedList"></div>
</div>

<footer>
  <div class="footer-inner">
    <span class="flogo">Root ASAP</span>
    <span>© 2026 Root ASAP · <a href="index.html" style="color:rgba(255,255,255,0.7);">Back to home</a></span>
  </div>
</footer>

<script>
(function(){
  var session = null;
  try { session = JSON.parse(localStorage.getItem('rootasap_session')); } catch(e){}
  if(session && session.name){
    var signupBtn = document.getElementById('signupBtn');
    var chipWrap = document.getElementById('userChipWrap');
    var chipLink = document.getElementById('userChipLink');
    var avatarEl = document.getElementById('userAvatarInitials');
    var nameEl = document.getElementById('userChipName');
    var logoutLink = document.getElementById('logoutLink');
    var dashboardUrl = session.role === 'business' ? 'business-dashboard.html' : (session.role === 'broker' ? 'broker-dashboard.html' : 'dashboard.html');
    var displayName = (session.role === 'business' && session.businessName) || (session.role === 'broker' && session.agencyName) || session.name;
    if(signupBtn) signupBtn.style.display = 'none';
    if(chipWrap) chipWrap.style.display = 'flex';
    var initials = displayName.split(' ').map(function(p){ return p[0]; }).join('').slice(0,2).toUpperCase();
    if(avatarEl) avatarEl.textContent = initials;
    if(nameEl) nameEl.textContent = displayName.split(' ')[0];
    if(chipLink) chipLink.setAttribute('href', dashboardUrl);
    if(logoutLink) logoutLink.addEventListener('click', function(e){
      e.preventDefault();
      localStorage.removeItem('rootasap_session');
      window.location.href = 'index.html';
    });
  }
})();

(function(){
  var articles = {
    'remittances-nigeria': {
      eyebrow: 'Markets · Nigeria',
      title: 'Diaspora remittances to Nigeria hit record high this quarter',
      byline: '4 Aug 2026 · Root ASAP Markets Desk',
      stats: [ ['$2.1bn', 'Remittances this quarter'], ['+14%', 'Year-on-year growth'], ['62%', 'Sent via formal channels'] ],
      body: [
        "Diaspora remittances to Nigeria reached a record $2.1 billion this quarter, according to central bank data, as more UK- and US-based Nigerians shift from informal transfer channels to regulated platforms offering better rates and traceability.",
        "The increase comes alongside growing interest in direct diaspora investment — rather than sending money home for consumption, a rising share of diaspora Nigerians are looking to put capital directly into vetted local businesses in exchange for a return, or to acquire small businesses outright.",
        "Trade and import businesses have been the biggest beneficiaries of this shift, with several Lagos-based operators reporting that diaspora-linked funding rounds closed faster than local bank financing over the same period.",
        "Analysts caution that while formal remittance channels are growing, informal transfers still make up a significant share of total flows — meaning the true scale of diaspora capital moving into Nigeria is likely higher than official figures suggest."
      ]
    },
    'kenya-agri-export': {
      eyebrow: 'Sectors · Kenya',
      title: "Kenya's agri-export sector draws fresh diaspora capital",
      byline: '29 Jul 2026 · Root ASAP Markets Desk',
      stats: [ ['£38M', 'Diaspora capital into agri-export, 2026'], ['9', 'New agri deals listed this quarter'], ['11%', 'Average indicative return'] ],
      body: [
        "Kenya's agricultural export sector is attracting a fresh wave of diaspora investment, with coffee, tea and horticulture producers increasingly turning to diaspora-linked platforms to fund working capital ahead of harvest season.",
        "Unlike traditional bank lending, which can take months to arrange and often requires collateral many smallholder-linked exporters don't have, diaspora investment platforms are matching Kenyan agri businesses with UK- and North America-based investors in a matter of weeks.",
        "The Rift Valley region has seen particularly strong activity, with several agri-export businesses using diaspora capital to bridge the gap between planting costs and export receivables.",
        "Industry groups have welcomed the trend, noting that diaspora capital tends to be patient and relationship-driven, with investors often reinvesting in the same business across multiple harvest cycles once trust is established."
      ]
    },
    'ghana-real-estate': {
      eyebrow: 'Sectors · Ghana',
      title: 'Ghana real estate demand climbs as diaspora buyers return',
      byline: '21 Jul 2026 · Root ASAP Markets Desk',
      stats: [ ['+22%', 'Diaspora-linked real estate deals, YoY'], ['£310K', 'Average deal size'], ['5 yrs', 'Typical investment term'] ],
      body: [
        "Demand for Ghanaian real estate from diaspora buyers has climbed sharply this year, reversing a slowdown seen in 2024 and 2025, as returning confidence in the cedi and stronger rental yields draw UK- and US-based Ghanaians back into the market.",
        "Developers in Accra report that diaspora-linked deals — whether structured as direct investment into a development or outright purchase of completed units — now account for a meaningful share of new project financing.",
        "The shift is also visible on Root ASAP's own marketplace, where real estate listings have drawn some of the highest match scores among diaspora investors with medium-term horizons.",
        "Brokers note that structured, AI-matched introductions are helping close deals faster than the informal, family-network approach that has traditionally dominated diaspora real estate investment in Ghana."
      ]
    }
  };

  var params = new URLSearchParams(window.location.search);
  var slug = params.get('article');
  var all = Object.keys(articles);
  var liveHeadline = params.get('headline');
  var liveSrc = params.get('src');

  if(slug && !articles[slug] && liveHeadline && liveSrc){
    // live headline from the Mediastack-powered ticker — not one of our written articles, so link out to the real source
    document.title = liveHeadline + ' — Root ASAP';
    document.getElementById('articleCard').innerHTML =
      '<div class="article-eyebrow">Live from Africa</div>' +
      '<h1>' + liveHeadline.replace(/</g, '&lt;') + '</h1>' +
      '<div class="article-byline">Sourced via Mediastack</div>' +
      '<div class="article-body"><p>This headline is pulled live from our African news feed. Read the full story at the original source.</p></div>' +
      '<div class="article-cta">' +
        '<div><h4>Read the full article</h4><p>Opens the original source in a new tab.</p></div>' +
        '<a class="btn-cta" href="' + liveSrc.replace(/"/g, '&quot;') + '" target="_blank" rel="noopener noreferrer">Read on source site</a>' +
      '</div>';
    var relatedHtml = all.map(function(s){
      return '<a class="related-item" href="news.html?article=' + s + '">' + articles[s].title + '</a>';
    }).join('');
    document.getElementById('relatedList').innerHTML = relatedHtml;
    return;
  }

  if(!slug || !articles[slug]) slug = all[0];
  var a = articles[slug];

  var statsHtml = a.stats.map(function(s){ return '<div><b>' + s[0] + '</b><span>' + s[1] + '</span></div>'; }).join('');
  var bodyHtml = a.body.map(function(p){ return '<p>' + p + '</p>'; }).join('');

  document.title = a.title + ' — Root ASAP';
  document.getElementById('articleCard').innerHTML =
    '<div class="article-eyebrow">' + a.eyebrow + '</div>' +
    '<h1>' + a.title + '</h1>' +
    '<div class="article-byline">' + a.byline + '</div>' +
    '<div class="stat-strip">' + statsHtml + '</div>' +
    '<div class="article-body">' + bodyHtml + '</div>' +
    '<div class="article-cta">' +
      '<div><h4>See the deals behind this story</h4><p>Browse live opportunities in this sector on Root ASAP.</p></div>' +
      '<a class="btn-cta" href="index.html#browse">Browse deals</a>' +
    '</div>';

  var relatedHtml = all.filter(function(s){ return s !== slug; }).map(function(s){
    return '<a class="related-item" href="news.html?article=' + s + '">' + articles[s].title + '</a>';
  }).join('');
  document.getElementById('relatedList').innerHTML = relatedHtml;
})();

(function(){
  var hamburger = document.getElementById('navHamburger');
  var drawer = document.getElementById('navDrawer');
  if(!hamburger || !drawer) return;
  var navLinks = document.querySelector('nav.mainnav .nav-links');
  if(navLinks){
    var clone = navLinks.cloneNode(true);
    clone.removeAttribute('id');
    clone.className = 'nav-drawer-links';
    drawer.appendChild(clone);
  }
  var dashIcon = document.querySelector('nav.mainnav .nav-icons > a.nav-icon');
  if(dashIcon){
    var a = document.createElement('a');
    a.href = dashIcon.getAttribute('href');
    a.textContent = dashIcon.textContent.trim();
    drawer.appendChild(a);
  }
  hamburger.addEventListener('click', function(){
    var isOpen = drawer.classList.toggle('open');
    hamburger.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
  });
})();
</script>
<script src="notifications.js"></script>

</body>
</html>
