<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Verify your email — Root ASAP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --green-50:#EAF4EE; --green-100:#CBE6D6; --green-500:#1F6F4A; --green-600:#175A3B; --green-700:#12472F;
    --green-800:#0F3D28; --green-900:#0A2A1B;
    --gold-200:#E9C67D; --gold-500:#B8862B;
    --gray-0:#FFFFFF; --gray-50:#FAFAF8; --gray-100:#F2F1ED; --gray-200:#E4E2DB;
    --gray-300:#CFCDC3; --gray-400:#A9A69A; --gray-500:#83807A; --gray-600:#605D52;
    --gray-700:#45433B; --gray-800:#2E2C27; --gray-900:#1A1917;
    --danger:#B03A2E; --danger-bg:#FDECEA; --danger-text:#7A281E;
    --success:#1F6F4A; --success-bg:#EAF4EE; --success-text:#12472F;
    --font-display:'Fraunces', Georgia, serif;
    --font-body:'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    --radius-sm:8px; --radius-md:14px; --radius-lg:20px; --radius-pill:999px;
    --shadow-card:0 1px 2px rgba(15,61,40,0.05), 0 4px 14px rgba(15,61,40,0.06);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:var(--font-body); font-size:14px; color:var(--gray-900); background:var(--gray-100); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;}
  a{color:inherit;}

  .vwrap{width:100%; max-width:460px;}
  .vlogo{display:flex; align-items:center; justify-content:center; gap:8px; font-family:var(--font-display); font-weight:600; font-size:19px; color:var(--green-800); margin-bottom:28px;}
  .vlogo svg{width:22px; height:22px;}

  .vcard{background:#fff; border-radius:var(--radius-lg); box-shadow:var(--shadow-card); padding:40px 36px; text-align:center;}

  .vicon{width:64px; height:64px; border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 20px; background:var(--green-50);}
  .vicon svg{width:30px; height:30px;}
  .vicon.error{background:var(--danger-bg);}
  .vicon.pending{background:var(--gray-100);}

  .spin{width:26px; height:26px; border:3px solid var(--gray-200); border-top-color:var(--green-500); border-radius:50%; animation:spin 0.8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .vcard h1{font-family:var(--font-display); font-size:21px; font-weight:600; color:var(--green-900); margin-bottom:10px;}
  .vcard p{color:var(--gray-600); font-size:13.5px; line-height:1.6; margin-bottom:22px;}
  .vcard p.email{font-weight:700; color:var(--gray-800);}

  .btn-v{display:inline-flex; align-items:center; justify-content:center; gap:8px; width:100%; background:var(--green-600); color:#fff; border:none; border-radius:var(--radius-pill); padding:13px; font-family:var(--font-body); font-weight:700; font-size:14px; cursor:pointer; text-decoration:none;}
  .btn-v:hover{background:var(--green-500);}
  .btn-v.secondary{background:transparent; color:var(--green-700); border:1.6px solid var(--gray-300); margin-top:10px;}
  .btn-v.secondary:hover{background:var(--gray-50);}
  .btn-v[disabled]{opacity:0.6; cursor:not-allowed;}

  .resend-note{font-size:12px; color:var(--gray-500); margin-top:16px; line-height:1.6;}
  .vfooter{text-align:center; font-size:12px; color:var(--gray-400); margin-top:22px;}
  .vfooter a{font-weight:700; color:var(--green-700);}
</style>
</head>
<body>

<div class="vwrap">
  <a class="vlogo" href="index.html">
    <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="20" cy="20" r="19" stroke="#B8862B" stroke-width="1.2"/>
      <path d="M20 11 L20 22" stroke="#B8862B" stroke-width="2" stroke-linecap="round"/>
      <path d="M20 14 L15 9" stroke="#B8862B" stroke-width="2" stroke-linecap="round"/>
      <path d="M20 14 L25 9" stroke="#B8862B" stroke-width="2" stroke-linecap="round"/>
      <path d="M20 22 C 20 22, 13 24, 11 30" stroke="#175A3B" stroke-width="2" stroke-linecap="round" fill="none"/>
      <path d="M20 22 C 20 22, 20 26, 20 31" stroke="#175A3B" stroke-width="2" stroke-linecap="round" fill="none"/>
      <path d="M20 22 C 20 22, 27 24, 29 30" stroke="#175A3B" stroke-width="2" stroke-linecap="round" fill="none"/>
    </svg>
    Root ASAP
  </a>

  <div class="vcard" id="vcard">
    <div class="vicon pending" id="vicon"><div class="spin"></div></div>
    <h1 id="vtitle">Verifying your email…</h1>
    <p id="vsub">Hang tight, this only takes a second.</p>
    <div id="vactions"></div>
  </div>

  <div class="vfooter">Wrong account? <a href="auth.html">Sign in with a different email</a></div>
</div>

<script>
(function(){
  var icon = document.getElementById('vicon');
  var title = document.getElementById('vtitle');
  var sub = document.getElementById('vsub');
  var actions = document.getElementById('vactions');

  var ICONS = {
    success: '<svg viewBox="0 0 24 24" fill="none" stroke="#1F6F4A" stroke-width="2"><path d="M20 6L9 17l-5-5" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    error: '<svg viewBox="0 0 24 24" fill="none" stroke="#B03A2E" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01" stroke-linecap="round"/></svg>'
  };

  function redirectFor(role){
    if(role === 'business') return 'business-dashboard.html';
    if(role === 'broker') return 'broker-dashboard.html';
    return 'dashboard.html';
  }

  function getAccounts(){
    try { return JSON.parse(localStorage.getItem('rootasap_accounts')) || []; } catch(e){ return []; }
  }
  function saveAccounts(list){
    localStorage.setItem('rootasap_accounts', JSON.stringify(list));
  }
  function getSession(){
    try { return JSON.parse(localStorage.getItem('rootasap_session')); } catch(e){ return null; }
  }
  function setSession(account){
    localStorage.setItem('rootasap_session', JSON.stringify(account));
  }
  function markVerifiedGlobally(email){
    // Backstop so this device recognises the email as verified even if the
    // matching account record isn't present in this browser's storage.
    var list = [];
    try { list = JSON.parse(localStorage.getItem('rootasap_verified_emails')) || []; } catch(e){}
    var lower = email.toLowerCase();
    if(list.indexOf(lower) === -1){ list.push(lower); }
    localStorage.setItem('rootasap_verified_emails', JSON.stringify(list));
  }

  function markVerifiedLocally(email){
    var accounts = getAccounts();
    var found = null;
    var updated = accounts.map(function(a){
      if(a.email && a.email.toLowerCase() === email.toLowerCase()){
        a.verified = true;
        found = a;
      }
      return a;
    });
    saveAccounts(updated);
    markVerifiedGlobally(email);

    var session = getSession();
    if(session && session.email && session.email.toLowerCase() === email.toLowerCase()){
      session.verified = true;
      setSession(session);
    }
    return found || session;
  }

  function showSuccess(email, role, name){
    var account = markVerifiedLocally(email);
    var target = redirectFor(role || (account && account.role));
    icon.className = 'vicon';
    icon.innerHTML = ICONS.success;
    title.textContent = 'Email verified';
    sub.innerHTML = 'Nice one' + (name ? ', ' + escapeHtml(name.split(" ")[0]) : '') + ' — your account is active. Taking you to your dashboard…';
    actions.innerHTML = '<a class="btn-v" href="' + target + '">Go to your dashboard →</a>';
    setTimeout(function(){ window.location.href = target; }, 2200);
  }

  function escapeHtml(s){
    return String(s || '').replace(/[&<>"]/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
    });
  }

  function showExpired(email){
    icon.className = 'vicon error';
    icon.innerHTML = ICONS.error;
    title.textContent = 'This link has expired';
    sub.innerHTML = 'Verification links are only valid for 24 hours' + (email ? ' — we can send a new one to <span class="email">' + escapeHtml(email) + '</span>' : '') + '.';
    if(email){
      actions.innerHTML = '<button class="btn-v" id="resendBtn">Send a new link</button><a class="btn-v secondary" href="auth.html">Back to sign in</a>';
      document.getElementById('resendBtn').addEventListener('click', function(){
        resend(email, this);
      });
    } else {
      actions.innerHTML = '<a class="btn-v" href="auth.html">Back to sign in</a>';
    }
  }

  function showInvalid(){
    icon.className = 'vicon error';
    icon.innerHTML = ICONS.error;
    title.textContent = "This link isn't valid";
    sub.textContent = "This verification link looks broken or was already used. Try signing in — if your account still needs verifying, you can resend the email from there.";
    actions.innerHTML = '<a class="btn-v" href="auth.html">Back to sign in</a>';
  }

  function showNotConfigured(){
    icon.className = 'vicon error';
    icon.innerHTML = ICONS.error;
    title.textContent = 'Verification is temporarily unavailable';
    sub.textContent = "We're having trouble confirming your email right now. Please try again shortly.";
    actions.innerHTML = '<a class="btn-v secondary" href="auth.html">Back to sign in</a>';
  }

  function resend(email, btn){
    btn.setAttribute('disabled', 'disabled');
    btn.textContent = 'Sending…';
    var accounts = getAccounts();
    var account = accounts.find(function(a){ return a.email && a.email.toLowerCase() === email.toLowerCase(); });
    fetch('/.netlify/functions/send-verification', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name: account ? account.name : '',
        email: email,
        role: account ? account.role : 'investor'
      })
    }).then(function(res){ return res.json().then(function(j){ return { ok: res.ok, body: j }; }); })
      .then(function(r){
        if(r.ok){
          btn.textContent = 'Sent — check your inbox';
        } else {
          btn.removeAttribute('disabled');
          btn.textContent = 'Send a new link';
          sub.innerHTML += '<br /><span style="color:#B03A2E;">Couldn\'t send that email — please try again in a moment.</span>';
        }
      })
      .catch(function(){
        btn.removeAttribute('disabled');
        btn.textContent = 'Send a new link';
      });
  }

  var params = new URLSearchParams(window.location.search);
  var tok = params.get('token');

  if(!tok){
    showInvalid();
    return;
  }

  fetch('/.netlify/functions/verify-token?token=' + encodeURIComponent(tok))
    .then(function(res){ return res.json(); })
    .then(function(data){
      if(data.valid){
        showSuccess(data.email, data.role, data.name);
      } else if(data.reason === 'expired'){
        showExpired(data.email);
      } else if(data.reason === 'not_configured'){
        showNotConfigured();
      } else {
        showInvalid();
      }
    })
    .catch(function(){
      showNotConfigured();
    });
})();
</script>

</body>
</html>
